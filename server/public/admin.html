<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teen Patti Admin</title><style>body{font-family:system-ui;background:#101b19;color:#f6e7bd;margin:0}header{padding:24px;background:#172e29;border-bottom:2px solid #b99850}main{max-width:980px;margin:35px auto;padding:16px}.panel{background:#1d302c;border:1px solid #806c40;border-radius:16px;padding:24px;margin-bottom:20px}input,button{padding:12px;border-radius:8px;margin:5px;border:1px solid #b99850}button{background:#e0b960;color:#15251d;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #53645d}#dashboard{display:none}.muted{color:#c8c5b9}</style></head><body><header><h1>♠ Teen Patti Admin</h1><span class="muted">Virtual chips only • No cash transactions</span></header><main><section class="panel" id="login"><h2>Admin login</h2><form id="loginForm"><input name="username" placeholder="Username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Login</button></form></section><section id="dashboard"><div class="panel"><h2>Overview</h2><p id="stats"></p><button id="refresh">Refresh</button><button id="logout">Logout</button></div><div class="panel"><h2>Players</h2><table><thead><tr><th>Name</th><th>Virtual chips</th><th>Adjust</th></tr></thead><tbody id="users"></tbody></table></div></section><p id="message" role="status"></p></main><script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data;}
async function refresh(){const [s,u]=await Promise.all([api('/admin/api/summary'),api('/admin/api/users')]);$('stats').textContent='Users: '+s.users+' | Tables: '+s.tables+' | Online seats: '+s.online+' | Storage: '+s.mode;$('users').replaceChildren();for(const p of u.users){const tr=document.createElement('tr');for(const value of [p.name,p.chips]){const td=document.createElement('td');td.textContent=value;tr.append(td);}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Adjust';btn.onclick=async()=>{const raw=prompt('Virtual chip change (+ or - integer, max 10000)');if(raw===null)return;try{await api('/admin/api/chips',{method:'POST',body:JSON.stringify({id:p.id,delta:Number(raw)})});await refresh();}catch(e){$('message').textContent=e.message;}};td.append(btn);tr.append(td);$('users').append(tr);}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});$('login').style.display='none';$('dashboard').style.display='block';await refresh();}catch(e){$('message').textContent=e.message;}};
$('refresh').onclick=()=>refresh().catch(e=>$('message').textContent=e.message);
$('logout').onclick=async()=>{await api('/admin/logout',{method:'POST'});location.reload();};
refresh().then(()=>{$('login').style.display='none';$('dashboard').style.display='block';}).catch(()=>{});
</script></body></html>
